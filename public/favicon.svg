<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="60%" stop-color="#0c0e14"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <!-- Gold Gradient for P -->
    <linearGradient id="goldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="25%" stop-color="#eac775"/>
      <stop offset="50%" stop-color="#c99e42"/>
      <stop offset="75%" stop-color="#dfb85e"/>
      <stop offset="100%" stop-color="#8a6318"/>
    </linearGradient>

    <!-- Dark Gunmetal / Platinum Gradient for A -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="35%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="luxuryShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#d4af37" flood-opacity="0.25"/>
    </filter>

    <!-- Gold Border Glow -->
    <linearGradient id="borderGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb85e" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#c99e42" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8a6318" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#borderGold)" stroke-width="4"/>

  <g filter="url(#luxuryShadow)">
    <!-- Letter P (Gold) -->
    <path d="M 180 110 
             L 320 110 
             C 385 110, 425 150, 425 215 
             C 425 280, 385 320, 320 320 
             L 245 320 
             L 245 400 
             L 180 400 
             Z 
             M 245 168 
             L 315 168 
             C 350 168, 368 185, 368 215 
             C 368 245, 350 262, 315 262 
             L 245 262 
             Z" 
          fill="url(#goldGrad)"/>

    <!-- Letter A (Intertwined Metallic Gunmetal) -->
    <path d="M 235 160 
             L 277 160 
             L 375 400 
             L 315 400 
             L 290 335 
             L 190 335 
             L 165 400 
             L 105 400 
             Z 
             M 240 215 
             L 205 300 
             L 275 300 
             Z" 
          fill="url(#silverGrad)"/>

    <!-- Bevel Detail on A Crossbar -->
    <path d="M 195 300 L 285 300 L 290 330 L 190 330 Z" fill="url(#silverGrad)" opacity="0.9"/>
  </g>
</svg>
